backend:
  name: github
  repo: carloterwoord/bbu-site
  branch: main
  base_url: https://YOUR-SVELTIA-AUTH-WORKER.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in /post/[slug].html" }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - {
          label: Author,
          name: author,
          widget: relation,
          collection: authors,
          search_fields: [name, slug],
          value_field: slug,
          display_fields: [name],
        }
      - {
          label: Categories,
          name: categories,
          widget: relation,
          collection: categories,
          search_fields: [name, slug],
          value_field: slug,
          display_fields: [name],
          multiple: true,
          required: false,
        }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Cover Image, name: coverImage, widget: image, required: false }
      - { label: Read Time, name: readTime, widget: string, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - {
          label: Body,
          name: body,
          widget: markdown,
          hint: "Markdown with embedded HTML is supported for rich content parity.",
        }

  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in /author/[slug].html" }
      - { label: Bio, name: bio, widget: text }
      - { label: Avatar, name: avatar, widget: image, required: false }
      - label: Social Links
        name: socialLinks
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Body, name: body, widget: hidden, default: "" }

  - name: categories
    label: Categories
    label_singular: Category
    folder: src/content/categories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in /category/[slug].html" }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Body, name: body, widget: hidden, default: "" }
