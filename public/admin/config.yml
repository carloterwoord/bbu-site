backend:
  name: github
  repo: carloterwoord/bbu-site
  branch: main
  base_url: https://YOUR-SVELTIA-AUTH-WORKER.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in /post/[slug].html" }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - {
          label: Author,
          name: author,
          widget: relation,
          collection: authors,
          search_fields: [name, slug],
          value_field: slug,
          display_fields: [name],
        }
      - {
          label: Categories,
          name: categories,
          widget: relation,
          collection: categories,
          search_fields: [name, slug],
          value_field: slug,
          display_fields: [name],
          multiple: true,
          required: false,
        }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Cover Image, name: coverImage, widget: image, required: false }
      - { label: Read Time, name: readTime, widget: string, required: false }
      - { label: Show Table of Contents, name: showTableOfContents, widget: boolean, default: true, required: false }
      - { label: Show Related Posts, name: showRelatedPosts, widget: boolean, default: true, required: false }
      - { label: Related Posts Heading, name: relatedPostsHeading, widget: string, default: Related posts, required: false }
      - {
          label: Related Posts,
          name: relatedPosts,
          widget: relation,
          collection: posts,
          search_fields: [title, slug],
          value_field: slug,
          display_fields: [title],
          multiple: true,
          required: false,
          hint: "Choose posts for the related-posts footer. Leave empty to use automatic related posts."
        }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - {
          label: Body,
          name: body,
          widget: markdown,
          hint: "Markdown with embedded HTML is supported for rich content parity.",
        }

  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in /author/[slug].html" }
      - { label: Bio, name: bio, widget: text }
      - { label: Avatar, name: avatar, widget: image, required: false }
      - label: Social Links
        name: socialLinks
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Body, name: body, widget: hidden, default: "" }

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Slug,
          name: slug,
          widget: string,
          hint: "Use lowercase and hyphens only. Reserved: admin, error. Slug 'search' uses a dedicated search template."
        }
      - { label: Excerpt, name: excerpt, widget: text, required: false }
      - { label: Show Header Block, name: showHeader, widget: boolean, default: true, required: false, hint: "Toggle the page headline area on/off." }
      - { label: Show Title, name: showTitle, widget: boolean, default: true, required: false, hint: "Only affects on-page headline display, not nav labels." }
      - { label: Show Description, name: showExcerpt, widget: boolean, default: true, required: false, hint: "Only affects on-page headline description display." }
      - { label: Navigation Label, name: navLabel, widget: string, required: false }
      - label: Navigation Group
        name: navGroup
        widget: select
        default: none
        options:
          - { label: Primary, value: primary }
          - { label: Secondary, value: secondary }
          - { label: Utility, value: utility }
          - { label: Hidden, value: none }
      - { label: Navigation Order, name: navOrder, widget: number, value_type: int, default: 0, min: 0 }
      - { label: Divider Before Item, name: dividerBefore, widget: boolean, default: false, required: false }
      - { label: Divider After Item, name: dividerAfter, widget: boolean, default: false, required: false }
      - {
          label: Navigation Icon,
          name: icon,
          widget: select,
          default: home,
          options: [home, membership, category, behind, principles, tools, voice, business, search, about]
        }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - {
          label: Body,
          name: body,
          widget: markdown,
          required: false,
          hint: "Optional. Use slug 'home' to control homepage intro content. The 'search' route uses a dedicated template and ignores this body."
        }

  - name: categories
    label: Categories
    label_singular: Category
    folder: src/content/categories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in /category/[slug].html" }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Header Image, name: headerImage, widget: image, required: false }
      - { label: Navigation Label, name: navLabel, widget: string, required: false }
      - label: Navigation Group
        name: navGroup
        widget: select
        default: none
        options:
          - { label: Primary, value: primary }
          - { label: Secondary, value: secondary }
          - { label: Utility, value: utility }
          - { label: Hidden, value: none }
      - { label: Navigation Order, name: navOrder, widget: number, value_type: int, default: 0, min: 0 }
      - { label: Divider Before Item, name: dividerBefore, widget: boolean, default: false, required: false }
      - { label: Divider After Item, name: dividerAfter, widget: boolean, default: false, required: false }
      - {
          label: Navigation Icon,
          name: icon,
          widget: select,
          default: category,
          options: [home, membership, category, behind, principles, tools, voice, business, search, about]
        }
      - { label: Body, name: body, widget: hidden, default: "" }

  - name: tags
    label: Tags
    label_singular: Tag
    folder: src/content/tags
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in /tag/[slug].html. Match post tag slugs to attach metadata and header images." }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Header Image, name: headerImage, widget: image, required: false }
      - { label: Body, name: body, widget: hidden, default: "" }
